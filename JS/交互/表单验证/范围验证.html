<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表单验证</title>

    <style>
        * {
            margin: 0;
            padding: 0;
        }
        #prompt {
            font-size: 12px;
            color: darkgray;
        }
        #score {
            border: 1px solid darkgray;
        }
        .right {
            background: url('../image/right.png') no-repeat 5px center;
            background-size: 15px 15px;
            padding-left: 20px;
            color: lightgreen !important; 
        }
        .error {
            background: url('../image/error.png') no-repeat 5px center;
            background-size: 15px 15px;
            padding-left: 20px;
            color: red !important; 
        }
    </style>
</head>
<body>
    <div id="contain">
        <label for="score">您的成绩：</label>
        <input type="text" placeholder="请输入分数" id="score">
        <span id="prompt">请输入您的成绩！</span>
    </div>
    <script>
        function $(id) {
            return typeof id === 'string' ? document.getElementById(id) : null;
        }

        // 当输入框失去焦点时，触发验证
        $('score').onblur = function() {
            // 获取输入的成绩
            var score = parseFloat(this.value);
            // NaN: Not a Number
            if(isNaN(score)){
                $('prompt').innerText = '输入的成绩不正确！';
                $('prompt').className = 'error';
                this.style.borderColor = 'red';
            } else if(score >= 0 && score <= 100) {
                $('prompt').innerText = '输入正确！';
                $('prompt').className = 'right';
                this.style.borderColor = 'lightgreen';
            } else {
                $('prompt').innerText = '输入的成绩不正确！';
                $('prompt').className = 'error';
                this.style.borderColor = 'red';
            }
        }

        // 当输入框获得焦点时，提示用户输入成绩
        $('score').onfocus = function() {
            $('prompt').innerText = '请输入您的成绩！';
            $('prompt').className = '';
            this.style.borderColor = 'darkgray';
            this.style.outline = 'none';
            // 清空输入框的内容
            this.value = '';
        }
    </script>
</body>
</html>
