<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        ul,li{
            margin: 0;
            padding: 0;
            list-style: none;
        }

        ul{
            overflow: hidden;
        }

        li{
            width: 100px;
            height: 30px;
            background-color: #eee;
            border: 1px solid #ccc;
            float: left;
            line-height: 40px;
            text-align: center;
            cursor: pointer;
        }

        div{
            width: 300px;
            height: 200px;
            border: 1px solid #ccc;
        }

        img{
            width: 100%;
            height: 100%;
            display: none;
        }
    </style>
</head>
<body>
    <ul>
        <li>玉桂狗1</li>
        <li>玉桂狗2</li>
        <li>333</li>
    </ul>
    <div>
        <img src="../image/玉桂狗睡.jpg" alt="" style="display: block;">
        <img src="../image/玉桂狗飞.jpg" alt="">
        <img src="../image/angle.jpg" alt="">
    </div>

    <script>
        var li = document.querySelectorAll('li');
        var imgs = document.querySelectorAll('img');

        for(var i=0;i<li.length;i++){
            li[i].index = i;

            // 鼠标移入事件
            li[i].onmouseover = function(){
                this.style.backgroundColor = 'pink';
            }

            // 鼠标移出事件
            li[i].onmouseout = function(){
                this.style.backgroundColor = '#eee';
            }

            li[i].onclick = function(){
                for(var j=0;j<li.length;j++){
                    imgs[j].style.display = 'none';
                }
                imgs[this.index].style.display = 'block';
            }
        }
    </script>
</body>
</html>
